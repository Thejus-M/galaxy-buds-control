[package]
name = "galaxy-buds-control"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "buds"
path = "src/main.rs"

[[bin]]
name = "budsd"
path = "src/bin/budsd.rs"

[dependencies]
bluetooth-serial-port-async = "0.6.3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
galaxy_buds_rs = "0.2.11"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
